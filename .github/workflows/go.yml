name: Go

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration_tests:
    env:
      # Fork PRs don't get repo secrets (e.g. ENTERPRISE_LICENSE), so
      # enterprise-only tests can't run against them. Skip those tests
      # automatically when the PR head repo isn't this repo.
      ENTERPRISE_DISABLED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      matrix:
        grafana_version: [ 12.0.0-ubuntu, 13.2.0-ubuntu ]
        use_tokens: [ 0, 1 ]
        go_version: [ 1.27.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: ./actions/setup_go
        with:
          go_version: "${{ matrix.go_version }}"
      - name: Run Reporting test
        if: ${{ matrix.grafana_version == '13.2.0-ubuntu' && matrix.use_tokens == 0 }}
        uses: ./actions/coverage
        with:
          grafana_version: "${{ matrix.grafana_version  }}"
          coverage_token: "${{ secrets.CODECOV_TOKEN }}"
          enterprise_jwt: "${{ secrets.ENTERPRISE_LICENSE }}"
          enterprise_disabled: "${{ env.ENTERPRISE_DISABLED }}"
      - name: Run Non Reporting test
        if: ${{ matrix.grafana_version != '13.2.0-ubuntu' || matrix.use_tokens != 0 }}
        env:
          ENTERPRISE_LICENSE: "${{ secrets.ENTERPRISE_LICENSE }}"
          GRAFANA_TEST_VERSION: "${{ matrix.grafana_version }}"
          TEST_TOKEN_CONFIG: "${{ matrix.use_tokens }}"
        run:  go tool -modfile tools/go.mod gotestsum --format testname  -- -covermode=atomic -coverpkg=$(go list ./... | egrep -v "mocks|test_tooling" | tr '\n' ',' )   ./...
