# Hugo Relearn theme params
# Reference: https://mcshelby.github.io/hugo-theme-relearn/configuration/reference/

title = "GDG"
images = ["cover.png"]

# Dark theme by default (no bright-green "relearn-auto" light default).
# First entry is the default for first-time visitors; readers can still
# switch to light via the variant switcher.
themeVariant = ["zen-dark", "zen-light"]

# We use the "versions" switcher (configured per-language in languages.toml)
# instead of the generic language switcher, since our "languages" are really
# our doc versions.
disableLanguageSwitchingButton = true

# Hide the oversized, non-interactive "More" heading above the GitHub
# shortcut link in the sidebar footer.
disableShortcutsTitle = true

# Ordering / navigation
ordersectionsby = "weight"
collapsibleMenu = true

# Edit-on-GitHub button (base editURL is set per-language in languages.toml)
disableSourceButton = false
disablePrintButton = true

# Misc UX
disableBreadcrumb = false
disableNextPrev = false
disableToc = false
titleSeparator = "::"
